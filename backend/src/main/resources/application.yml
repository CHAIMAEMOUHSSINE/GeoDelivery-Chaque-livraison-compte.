server:
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB}
    username: ${DB_USERNAME:GEODELIVERY}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  sql:
    init:
      mode: never
app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@geodelivery.local}
  admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
